<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Tracker" />

    <title>Gym Tracker — Catat Workout & Progress Latihan</title>
    <meta name="description" content="Gym Tracker gratis untuk mencatat workout, melihat progress latihan, dan menjaga konsistensi. Offline-first, tanpa login, langsung di browser-mu." />
    <meta name="keywords" content="gym tracker, catat workout, progress latihan, fitness tracker, workout log, strength training" />
    <meta name="author" content="Gym Tracker" />
    <link rel="canonical" href="https://gym-tracker.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gym Tracker — Catat Workout & Progress Latihan" />
    <meta property="og:description" content="Catat workout-mu, pantau PR, dan jaga konsistensi latihan. Gratis, offline-first, tanpa login." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://gym-tracker.app/" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gym Tracker — Catat Workout & Progress Latihan" />
    <meta name="twitter:description" content="Catat workout-mu, pantau PR, dan jaga konsistensi latihan. Gratis, offline-first, tanpa login." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme init: runs before React hydration to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gym-tracker.theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) { /* Storage unavailable; keep the CSS default. */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
